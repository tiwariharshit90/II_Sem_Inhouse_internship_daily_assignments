<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bootstrap Revision</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<h1 class="mb-4">Bootstrap Revision</h1>

<div class="alert alert-success">Bootstrap Loaded Successfully!</div>

<div class="row mb-3">
  <div class="col-md-6 bg-primary text-white p-3">Column 1</div>
  <div class="col-md-6 bg-warning p-3">Column 2</div>
</div>

<button class="btn btn-primary">Primary</button>
<button class="btn btn-success">Success</button>

<hr>

<form>
<label class="form-label">Name</label>
<input class="form-control" type="text">
<label class="form-label mt-3">Email</label>
<input class="form-control" type="email">
<button class="btn btn-dark mt-3">Submit</button>
</form>

<hr>

<div class="card mt-3" style="width:18rem;">
<div class="card-body">
<h5 class="card-title">Bootstrap Card</h5>
<p class="card-text">Simple card example.</p>
<a href="#" class="btn btn-info">Read More</a>
</div>
</div>

<hr>

<table class="table table-bordered table-striped mt-3">
<tr><th>Name</th><th>Age</th></tr>
<tr><td>Harshit</td><td>20</td></tr>
</table>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
