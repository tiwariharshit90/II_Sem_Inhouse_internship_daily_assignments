<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Submission Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4facfe;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #00c6ff;
        }

        .success {
            margin-top: 15px;
            color: green;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Project Submission</h2>

    <form id="submissionForm">
        <input type="text" placeholder="Student Name" required>
        <input type="text" placeholder="Roll Number" required>
        <input type="text" placeholder="Project Title" required>
        <textarea placeholder="Project Description" rows="3"></textarea>
        <input type="file" required>

        <button type="submit">Submit Project</button>
    </form>

    <div class="success" id="successMessage">
        ✅ Project Submitted Successfully!
    </div>
</div>

<script>
    document.getElementById("submissionForm").addEventListener("submit", function(event) {
        event.preventDefault();
        document.getElementById("successMessage").style.display = "block";
    });
</script>

</body>
</html>
